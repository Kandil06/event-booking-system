<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{fragments :: head('My tickets')}"></head>

<body>
	<nav th:replace="~{fragments :: nav}"></nav>

	<main class="container">
		<div th:replace="~{fragments :: flash}"></div>

		<div class="page-head">
			<h1>My tickets</h1>
		</div>

		<div class="card empty" th:if="${bookings.isEmpty()}">
			You have no bookings yet. <a th:href="@{/events}">Browse events</a>
		</div>

		<section class="card" th:each="b : ${bookings}">
			<h2><a th:href="@{/bookings/{id}(id=${b.id})}" th:text="${b.event.title}">Event</a></h2>
			<div class="meta"><strong>When</strong>
				<span th:text="${#temporals.format(b.event.startsAt, 'EEE d MMM yyyy, HH:mm')}">date</span>
				&nbsp;·&nbsp; <strong>Where</strong> <span th:text="${b.event.location}">location</span>
			</div>
			<div class="meta" style="margin-bottom: 12px">Codes sent to <span th:text="${b.email}">email</span></div>
			<ul class="tickets">
				<li th:each="t : ${b.tickets}">
					<span class="ticket-code" th:classappend="${t.used} ? 'used'" th:text="${t.code}">CODE</span>
				</li>
			</ul>
		</section>
	</main>
</body>

</html>
