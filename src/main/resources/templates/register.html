<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{fragments :: head('Sign up')}"></head>

<body>
	<nav th:replace="~{fragments :: nav}"></nav>

	<main class="container narrow">
		<section class="card">
			<h1>Create your account</h1>
			<form th:action="@{/register}" th:object="${registerForm}" method="post">
				<div class="field">
					<label for="fullName">Full name</label>
					<input type="text" id="fullName" th:field="*{fullName}" required autofocus>
					<div class="field-error" th:errors="*{fullName}"></div>
				</div>
				<div class="field">
					<label for="email">Email</label>
					<input type="email" id="email" th:field="*{email}" required>
					<div class="field-error" th:errors="*{email}"></div>
				</div>
				<div class="field">
					<label for="password">Password</label>
					<input type="password" id="password" th:field="*{password}" minlength="6" required>
					<div class="field-error" th:errors="*{password}"></div>
				</div>
				<button class="btn" type="submit">Sign up</button>
			</form>
		</section>

		<p class="muted" style="margin-top: 16px">Already registered? <a th:href="@{/login}">Log in</a></p>
	</main>
</body>

</html>
