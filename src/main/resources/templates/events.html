<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{fragments :: head('Events')}"></head>

<body>
	<nav th:replace="~{fragments :: nav}"></nav>

	<main class="container">
		<div th:replace="~{fragments :: flash}"></div>

		<div class="page-head">
			<h1>Upcoming events</h1>
		</div>

		<div class="card empty" th:if="${events.isEmpty()}">No events have been published yet.</div>

		<div class="grid">
			<article class="card event-card" th:each="v : ${events}">
				<h2><a th:href="@{/events/{id}(id=${v.event.id})}" th:text="${v.event.title}">Title</a></h2>
				<div class="meta"><strong>When</strong>
					<span th:text="${#temporals.format(v.event.startsAt, 'EEE d MMM yyyy, HH:mm')}">date</span>
				</div>
				<div class="meta"><strong>Where</strong> <span th:text="${v.event.location}">location</span></div>
				<div class="bar">
					<div th:style="'width:' + ${v.percentBooked} + '%'"></div>
				</div>
				<p>
					<span class="badge off" th:if="${v.event.past}">Ended</span>
					<span class="badge off" th:if="${!v.event.past and v.soldOut}">Sold out</span>
					<span class="badge" th:if="${v.bookable}"
						th:text="${v.remaining} + ' of ' + ${v.event.capacity} + ' left'">left</span>
				</p>
				<a class="btn" th:href="@{/events/{id}(id=${v.event.id})}"
					th:text="${v.bookable} ? 'Book tickets' : 'View details'">Book</a>
			</article>
		</div>
	</main>
</body>

</html>
