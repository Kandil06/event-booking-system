<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{fragments :: head('Log in')}"></head>

<body>
	<nav th:replace="~{fragments :: nav}"></nav>

	<main class="container narrow">
		<div th:replace="~{fragments :: flash}"></div>
		<div class="alert error" th:if="${param.error}">Wrong email or password.</div>
		<div class="alert success" th:if="${param.logout}">You have been logged out.</div>

		<section class="card">
			<h1>Log in</h1>
			<form th:action="@{/login}" method="post">
				<div class="field">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" required autofocus>
				</div>
				<div class="field">
					<label for="password">Password</label>
					<input type="password" id="password" name="password" required>
				</div>
				<button class="btn" type="submit">Log in</button>
			</form>
		</section>

		<p class="muted" style="margin-top: 16px">No account yet? <a th:href="@{/register}">Sign up</a></p>
	</main>
</body>

</html>
