spring.application.name=booking

# Database: H2 stored in ./data so events and bookings survive restarts
spring.datasource.url=jdbc:h2:file:./data/booking
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# noinspection SpringBootApplicationProperties
# Admin account created on first start (change the password!)
app.admin.email=admin@booking.local
app.admin.password=${ADMIN_PASSWORD:change-me}

# Most tickets one booking may contain
app.booking.max-per-booking=10

# Email: ticket codes are only written to the console until spring.mail.host is set.
# Gmail example (use an App Password, not your normal password):
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=you@gmail.com
#spring.mail.password=your-app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=no-reply@booking.local
